<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pay — LD Print 3D</title>
<style>
  :root{ --amber:#4997F4; --purple:#826DC3; --bg:#12151F; --paper:#F4F6F7; --text:#12141F; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:#fff; min-height:100%;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--paper); color:var(--text); border-radius:16px; padding:32px 28px;
    max-width:380px; width:100%; text-align:center; box-shadow:0 20px 50px -20px #000a;
  }
  .badge{
    width:52px; height:52px; border-radius:12px; margin:0 auto 16px;
    background:linear-gradient(135deg,var(--amber),var(--purple));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:16px;
  }
  h1{font-size:18px; margin:0 0 4px;}
  .amount{font-size:32px; font-weight:800; margin:14px 0 2px;}
  .ref{font-size:12.5px; color:#666; margin-bottom:22px;}
  .pay-btn{
    display:block; width:100%; padding:14px; border:none; border-radius:10px;
    background:var(--amber); color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; text-decoration:none; margin-bottom:12px;
  }
  .pay-btn:active{filter:brightness(0.95);}
  .upi-id{font-family:monospace; font-size:13px; color:#444; word-break:break-all; margin-top:6px;}
  .note{font-size:11.5px; color:#888; margin-top:18px; line-height:1.5;}
  .error{color:#c0392b; font-size:13px; margin-top:14px;}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">LD</div>
    <h1 id="payee">Payment</h1>
    <div class="amount" id="amount">—</div>
    <div class="ref" id="ref"></div>
    <a class="pay-btn" id="payBtn" href="#">Open UPI App to Pay</a>
    <div class="upi-id" id="upiIdText"></div>
    <div class="note">If the button doesn't open your UPI app automatically, copy the UPI ID above into GPay / PhonePe / Paytm and enter the amount manually.</div>
    <div class="error" id="errorMsg" style="display:none;"></div>
  </div>

<script>
  function qs(name){
    const params = new URLSearchParams(window.location.search);
    return params.get(name) || '';
  }
  const pa = qs('pa');       // UPI ID
  const pn = qs('pn');       // payee name
  const am = qs('am');       // amount
  const tn = qs('tn');       // note / invoice number

  if(!pa){
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'No payment details were provided in this link.';
  } else {
    document.getElementById('payee').textContent = pn ? ('Pay ' + pn) : 'Make Payment';
    document.getElementById('amount').textContent = am ? ('₹' + am) : '';
    document.getElementById('ref').textContent = tn ? ('Ref: ' + tn) : '';
    document.getElementById('upiIdText').textContent = 'UPI ID: ' + pa;

    const upiUri = 'upi://pay?pa=' + encodeURIComponent(pa)
      + (pn ? '&pn=' + encodeURIComponent(pn) : '')
      + (am ? '&am=' + encodeURIComponent(am) : '')
      + '&cu=INR'
      + (tn ? '&tn=' + encodeURIComponent(tn) : '');

    const btn = document.getElementById('payBtn');
    btn.href = upiUri;

    // Try to open the UPI app automatically once, in addition to the button being tappable.
    // Some mobile browsers block this without a tap, which is exactly why the button exists as a fallback.
    setTimeout(function(){
      window.location.href = upiUri;
    }, 400);
  }
</script>
</body>
</html>
